<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieDB</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/dark_global.css" />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/index_dark.css" />
    <script src="./js/index.js" defer></script>
    <script src="./js/dark_mode_toggle.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <nav>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M11 5.75C11 5.33579 11.3358 5 11.75 5H19.25C19.6642 5 20 5.33579 20 5.75C20 6.16421 19.6642 6.5 19.25 6.5H11.75C11.3358 6.5 11 6.16421 11 5.75ZM4 11.75C4 11.3358 4.33579 11 4.75 11H19.25C19.6642 11 20 11.3358 20 11.75C20 12.1642 19.6642 12.5 19.25 12.5H4.75C4.33579 12.5 4 12.1642 4 11.75ZM4.75 17C4.33579 17 4 17.3358 4 17.75C4 18.1642 4.33579 18.5 4.75 18.5H12.25C12.6642 18.5 13 18.1642 13 17.75C13 17.3358 12.6642 17 12.25 17H4.75Z"
              fill="#DBE3FF" />
          </svg>
        </nav>
        <h1>MyMovies</h1>
        <label class="mode_toggle">
          <input type="checkbox" id="darkModeToggle" />
          <span class="slider round"></span>
        </label>
      </header>
      <section class="side_scroll">
        <div class="area_header">
          <h1>Now showing</h1>
          <button>See More</button>
        </div>
        <div id="showing-container"></div>
      </section>

      <section class="popular">
        <div class="area_header">
          <h1>Popular</h1>
          <button>See More</button>
        </div>
        <div id="popular-container"></div>
      </section>
    </main>
    <nav class="bottom-nav">
      <ul>
        <li><img src="./svg/BookmarkTransparent.svg" alt="Bookmarks" /></li>
        <li><img src="./svg/Ticket.svg" alt="Tickets" /></li>
        <li><img src="./svg/Favourite.svg" alt="Favourites" /></li>
      </ul>
    </nav>
  </body>
</html>
